<header class="site-header" role="banner">
  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>

    <nav class="site-nav" aria-label="Primary navigation">
      <div class="header-right">
      <!-- Mobile hamburger menu button (only visible on mobile docs pages) -->
      {% if page.layout == 'docs' %}
        <button id="sidebar-toggle" class="sidebar-toggle-btn" aria-expanded="false" aria-controls="docs-sidebar" aria-label="Toggle navigation menu">
          <span class="hamburger-icon">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
          </span>
        </button>
      {% endif %}
            
      <!-- GitHub Link -->
      <a href="https://github.com/danielmeppiel/awesome-ai-native" 
         class="github-btn" 
         target="_blank" 
         rel="noopener noreferrer"
         aria-label="View on GitHub">

      <!-- Primary CTA -->
      <a href="https://danielmeppiel.github.io/agentic-sdlc-handbook/" class="btn-primary" target="_blank" rel="noopener noreferrer">Read the Handbook</a>
      </div>
    </nav>
  </div>
</header>
